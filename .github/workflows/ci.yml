name: ci
on: [push, pull_request]
jobs:
  offline:
    # No network: only the shipped cases (vectors, derived files) and the runner self-tests.
    # Cases that need fixtures/*/raw are reported as not-fetched until tools/fetch.py has run locally (D-148).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m gpconf run --adapter tests.adapters.reference:Parser --case alpha5-encoding-vectors --case alpha5-tle-derived --case kvn-syntax-variants --case tle-writer-alpha5
      - run: python -m gpconf run --adapter tests.adapters.naive:Parser --case alpha5-encoding-vectors --case alpha5-tle-derived --case kvn-syntax-variants --case tle-writer-alpha5 || test $? -eq 1
