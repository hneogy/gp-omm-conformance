[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpconf"
version = "0.6.0"
# The About line of docs/BRAND.md, word for word (D-242).
description = "Free test kit: does your satellite software handle catalog numbers above 99,999? Built from real CelesTrak data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
keywords = ["satellite", "TLE", "two-line element set", "Alpha-5", "OMM", "CCSDS", "SGP4", "CelesTrak", "catalog number", "conformance testing"]
# No licence classifier: the licence is the expression above (PEP 639), and a build refuses both. The Python versions
# named are the ones the suite runs on: 3.9 and 3.12 in CI, 3.14 at each release (D-242).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# The library presets' libraries (D-151, D-153). The Node presets' libraries cannot be pip extras.
sgp4 = ["sgp4"]
pyephem = ["ephem"]

[project.scripts]
gpconf = "gpconf.__main__:main"

[project.urls]
# The PyPI page's sidebar, the only navigation a visitor there gets (D-159). DOI is the Zenodo concept DOI, which
# resolves to the latest release.
Homepage = "https://gpconf.neogy.dev"
Repository = "https://github.com/hneogy/gp-omm-conformance"
Issues = "https://github.com/hneogy/gp-omm-conformance/issues"
DOI = "https://doi.org/10.5281/zenodo.22867654"

[tool.setuptools.packages.find]
# Found, not listed: an explicit list, ["gpconf"], would have dropped gpconf.adapters from a wheel (D-153, D-156).
include = ["gpconf", "gpconf.*"]

[tool.setuptools.package-data]
# gpconf/corpus/ exists only in a tree staged from a public export by tools/stage_package.py, never in the repository.
gpconf = ["corpus/**/*"]
"gpconf.adapters" = ["*.mjs"]
